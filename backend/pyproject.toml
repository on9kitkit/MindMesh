[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "studyroom-backend"
version = "0.1.0"
description = "FastAPI foundation for the StudyRoom room API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
    "websockets>=16.1,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
